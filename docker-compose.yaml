version: '3.3'

services:
  redis:
    image: redis:6.0.8-alpine
    ports:
      - 6379:6379

  tests:
    image: node:lts-alpine
    container_name: express-redis-cache2-tests
    depends_on:
      - redis
    volumes:
      - .:/src
    working_dir: /src
    environment:
      EX_RE_CA_HOST: redis
    command: yarn test
